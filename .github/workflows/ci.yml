name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-service/requirements-render.txt
      - run: pip install -r agent-service/requirements-render.txt
      - run: python -m compileall -q agent-service/app
      - name: Verify bundled knowledge retrieval
        env:
          PYTHONPATH: agent-service
          RAG_BACKEND: lexical
        run: >-
          python -c "from app.rag.retriever import get_retriever;
          rows=get_retriever().search('什么是多模态');
          assert rows and '多模态' in rows[0]['section']"
      - name: Verify JavaScript syntax
        run: node --check scripts.js
